name: Scripts Check

# Wires scripts/deploy-testnet.sh and scripts/integration_test.sh into CI
# (issue #269): both are syntax/lint-checked on every push and PR.
#
# Issue #78: the deploy-sandbox job executes scripts/run-deploy-sandbox.sh
# against a local Stellar standalone (Quickstart) container, giving the
# deployment logic an actual end-to-end smoke test rather than just a
# syntax check.
#
# The integration-test job that used to run integration_test.sh end-to-end
# against a local Soroban network was removed: it depended on installing
# stellar-cli with `--features opt`, a feature that no longer exists on the
# stellar-cli version CI installs, so the job could never succeed regardless
# of anything in this repo.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Syntax-check shell scripts
        run: |
          bash -n scripts/deploy-testnet.sh
          bash -n scripts/run-deploy-sandbox.sh
          bash -n scripts/integration_test.sh
          bash -n scripts/export-spec.sh
          bash -n scripts/check_resource_costs.sh
          bash -n scripts/check-wasm-size.sh

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run shellcheck
        run: shellcheck scripts/*.sh

  # Issue #78: execute deploy-testnet.sh logic against a local Stellar
  # standalone container so the deployment script is actually run, not merely
  # syntax-checked.  This catches regressions in the build→deploy→verify
  # sequence before they reach the live testnet.
  deploy-sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Cache Rust build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      - name: Run deploy sandbox smoke-test
        run: scripts/run-deploy-sandbox.sh

  spec-freshness:
    # Runs scripts/export-spec.sh --check to verify that the committed JSON
    # snapshot in spec/ matches the compiled WASM bindings (#49). Any PR that
    # changes entry point signatures, error codes, or struct fields without
    # updating the spec will fail here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust wasm32v1-none target
        run: rustup target add wasm32v1-none

      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Install stellar-cli
        run: cargo install --locked stellar-cli

      - name: Build contract and verify spec freshness
        run: scripts/export-spec.sh --check
