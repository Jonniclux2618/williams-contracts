# cargo-deny configuration for the will contract workspace.
# Run locally with `cargo deny check`; CI runs it on pull requests.
# Docs: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only check the crates we actually build/link, not dev-only or fuzz tooling.
all-features = false

[advisories]
db-url = "https://github.com/rustsec/advisory-db"
db-path = "~/.cargo/advisory-db"
# Fail CI on any reported vulnerability.
vulnerability = "deny"
# Unmaintained crates are warnings, not hard failures.
unmaintained = "warn"
# Do not fail on yanked crates that are still pinned transitively.
yanked = "warn"
ignore = []

[licenses]
# Allow only permissive licenses compatible with MIT/Apache-2.0.
# Copyleft (GPL/AGPL/LGPL) is intentionally excluded.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "MPL-2.0",
]
# Fail if any dependency uses a license not in the allow list.
confidence-threshold = 0.8
exceptions = []

[bans]
# Prevent binary bloat from duplicated transitive crates.
multiple-versions = "deny"
# Deny wildcard version requirements in our own manifests.
wildcards = "deny"
# Highlight duplicate crates that are only pulled in once but still worth noting.
highlight = "all"
# Allow-list of crates permitted to appear in multiple versions, if any.
skip = []
skip-tree = []

[sources]
# Only allow crates from crates.io; no git or unknown registries.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
